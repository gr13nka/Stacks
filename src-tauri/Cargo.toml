[package]
name = "stacks"
version = "0.1.0"
description = "Stacks — sort photos off cards and drives, stack by stack"
authors = ["Andrey"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "stacks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
rayon = "1.10"
sha2 = "0.10"
hex = "0.4"
nom-exif = "3.7"
kamadak-exif = "0.6"          # crate name `exif` in code
imagesize = "0.13"
reverse_geocoder = "4.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSFileManager", "NSNotification", "NSString", "NSArray", "NSDictionary", "NSError", "NSValue", "NSEnumerator", "NSOperation", "NSObject", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSWindow", "NSResponder", "NSApplication"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
